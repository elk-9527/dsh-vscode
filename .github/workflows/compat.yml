name: DSH 版本兼容

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'compat/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      editor_checks:
        description: '运行原生 VS Code 完整兼容验收（最低版本、Chat 基线和稳定版）'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      manifest_sha256: ${{ steps.panel.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: versions
        name: 查询官方精确版本
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $matrix = '{"dsh":["0.1.5-rc.2","0.2.0-rc.2","0.2.1-alpha.1","0.2.1-rc.2"]}'
          } else {
            $matrix = node tools/compat/test.cjs --discover --matrix
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
      - name: 构建供全部任务共同验收的唯一候选包
        run: node tools/bridge/packages.cjs --out build/candidates
      - id: panel
        shell: pwsh
        run: |
          $file = Get-Item -LiteralPath build/candidates/manifest.json
          "sha256=$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: build/candidates/*
          if-no-files-found: error

  kernel:
    needs: discover
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJson(needs.discover.outputs.matrix).dsh }}
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: build/candidates
      - name: 核对共同候选清单及每个安装包摘要
        shell: pwsh
        run: |
          if ((Get-FileHash -LiteralPath build/candidates/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ needs.discover.outputs.manifest_sha256 }}') { throw 'Candidate manifest digest mismatch' }
          $manifest = Get-Content -LiteralPath build/candidates/manifest.json -Raw | ConvertFrom-Json
          foreach ($artifact in $manifest.artifacts) {
            if ((Get-FileHash -LiteralPath $artifact.file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw 'Candidate archive digest mismatch' }
          }
      - name: 隔离真实内核与本机模型服务
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath build/candidates/manifest.json -Raw | ConvertFrom-Json
          $tgz = ($manifest.artifacts | Where-Object kind -eq 'tgz').file
          node tools/compat/test.cjs --dsh ${{ matrix.dsh }} --install --tgz $tgz
      - name: 导出公开验证结果
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath build/compat -Filter report.json -Recurse | ForEach-Object {
            node tools/compat/public-evidence.cjs $_.FullName (Join-Path $_.DirectoryName 'public-validation.json')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.os }}-${{ matrix.dsh }}
          path: |
            build/compat/**/public-validation.json

  minimum-editor:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.editor_checks }}
    needs: discover
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        editor: [minimum, chat, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: build/candidates
      - name: 核对共同安装包摘要
        shell: pwsh
        run: |
          if ((Get-FileHash -LiteralPath build/candidates/manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ needs.discover.outputs.manifest_sha256 }}') { throw 'Candidate manifest digest mismatch' }
          $manifest = Get-Content -LiteralPath build/candidates/manifest.json -Raw | ConvertFrom-Json
          foreach ($artifact in $manifest.artifacts) {
            if ((Get-FileHash -LiteralPath $artifact.file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw 'Candidate archive digest mismatch' }
          }
      - name: 从上游包冷启动构建测试插件
        run: node tools/bridge/build-pilots.cjs --fresh
      - name: 准备精确内核和最低编辑器
        shell: pwsh
        run: |
          npm install --prefix build/editor-runtime --no-audit --no-fund @deepseek-ai/dsh@0.2.1-alpha.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $minimumVersion = ((Get-Content -LiteralPath packages/vscode-extension/package.json -Raw | ConvertFrom-Json).engines.vscode).TrimStart('^')
          $chatBaseline = (Get-Content -LiteralPath compat/editors.json -Raw | ConvertFrom-Json).chatBaseline
          $version = if ('${{ matrix.editor }}' -eq 'minimum') { $minimumVersion } elseif ('${{ matrix.editor }}' -eq 'chat') { $chatBaseline } else { 'latest' }
          Invoke-WebRequest "https://update.code.visualstudio.com/$version/win32-x64-archive/stable" -OutFile build/vscode-minimum.zip
          Expand-Archive -LiteralPath build/vscode-minimum.zip -DestinationPath build/vscode-editor
      - name: 默认启动下验收完整原生流程
        shell: pwsh
        run: |
          $env:DSH_PANEL_DSH = 'node "' + (Join-Path $PWD 'build/editor-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js') + '"'
          $env:DSH_PANEL_CODE = Join-Path $PWD 'build/vscode-editor/Code.exe'
          $manifest = Get-Content -LiteralPath build/candidates/manifest.json -Raw | ConvertFrom-Json
          ./tools/bridge/check-minimum.ps1 -DshVersion 0.2.1-alpha.1 -Vsix ($manifest.artifacts | Where-Object kind -eq 'vsix').file -Tgz ($manifest.artifacts | Where-Object kind -eq 'tgz').file -Sdk ($manifest.artifacts | Where-Object kind -eq 'sdk').file
      - name: 导出最低编辑器公开验证结果
        shell: pwsh
        run: |
          $report = Get-ChildItem -LiteralPath build/compat -Filter bridge-report.json -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ('${{ matrix.editor }}' -eq 'minimum') {
            node tools/compat/editor-evidence.cjs $report.FullName build/public-editor-validation.json
          } else {
            node tools/compat/editor-evidence.cjs $report.FullName build/public-editor-validation.json --supported
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 导出原生阶段状态
        if: always()
        shell: pwsh
        run: |
          $report = Get-ChildItem -LiteralPath build/compat -Filter bridge-report.json -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($report) {
            node tools/compat/public-evidence.cjs $report.FullName build/public-editor-stages.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-${{ matrix.editor }}
          path: |
            build/public-editor-validation.json
            build/public-editor-stages.json
