     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 6.2v8.1a2.2 2.2 0 0 1-2.2 2.2H9.4l-4.6 3.6a.45.45 0 0 1-.73-.35v-3.25A2.2 2.2 0 0 1 4 14.3V6.2A2.2 2.2 0 0 1 6.2 4h11.6A2.2 2.2 0 0 1 20 6.2Z"/>
  <path d="M8.6 9.2l2.3 2-2.3 2"/>
</svg>
