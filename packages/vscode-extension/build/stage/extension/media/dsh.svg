<!--
  DSH Panel 的活动栏图标（占位）。

  VS Code 对活动栏图标的要求：24×24、单色、用 currentColor 上色，
  这样它会自动跟随你当前的主题（浅色/深色都会是正确的前景色）。

  这是**占位稿** —— 正式定稿时会出 2–3 个方案让你挑。
-->
